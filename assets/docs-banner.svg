<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" aria-label="EasySupport docs banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
  </pattern>
  <rect width="1600" height="400" fill="url(#grid)" opacity="0.3"/>

  <!-- Left: logo + title -->
  <g transform="translate(100, 110)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="130" rx="26" fill="#171717" stroke="#333333" stroke-width="2"/>
      <rect x="0" y="0" width="130" height="8" rx="4" fill="url(#accent)"/>
      <circle cx="65" cy="54" r="18" fill="#171717" stroke="url(#accent)" stroke-width="4"/>
      <path d="M49 54 Q65 36 81 54" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <path d="M39 86 L65 112 L91 86" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="170" y="152" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">EasySupport</text>
    <text x="170" y="212" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0.03em">Documentation</text>
  </g>

  <!-- Right: stacked product cards -->
  <g transform="translate(960, 60)">
    <rect x="0" y="0" width="460" height="280" rx="16" fill="#171717" stroke="#333333" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="56" rx="16" fill="#111111"/>
    <rect x="24" y="20" width="14" height="14" rx="2" fill="#7c3aed"/>
    <rect x="24" y="32" width="14" height="14" rx="2" fill="#333333"/>
    <rect x="24" y="44" width="14" height="14" rx="2" fill="#333333"/>
    <rect x="32" y="88" width="396" height="10" rx="5" fill="#333333"/>
    <rect x="32" y="110" width="280" height="10" rx="5" fill="#333333"/>
    <rect x="32" y="132" width="210" height="10" rx="5" fill="#333333"/>
    <circle cx="46" cy="176" r="8" fill="#7c3aed"/>
    <rect x="64" y="170" width="340" height="16" rx="8" fill="#1a1a1a"/>
  </g>

  <!-- Accent spark -->
  <circle cx="1520" cy="120" r="40" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1520" cy="120" r="16" fill="#ffffff" opacity="0.9"/>
</svg>
