<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- drifting background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f22">
        <animate attributeName="stop-color" values="#1e1f22;#232036;#141d2e;#1e1f22" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2b2d31">
        <animate attributeName="stop-color" values="#2b2d31;#3a2f5e;#1b2a4a;#2b2d31" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- brand sweep across the wordmark -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c7d2fe">
        <animate attributeName="stop-color" values="#c7d2fe;#ffffff;#a5b4fc;#c7d2fe" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.65" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardclip"><rect x="460" y="70" width="280" height="160" rx="24"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="300" rx="24" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="560" ry="180" fill="url(#glow)">
    <animate attributeName="rx" values="520;600;520" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- subtle drifting grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- logo card -->
  <g>
    <rect x="460" y="70" width="280" height="160" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <g clip-path="url(#cardclip)">
      <image href="logo.png" x="545" y="95" width="110" height="110">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
      </image>
    </g>
    <text x="600" y="235" font-family="sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.9">EasySupport</text>
  </g>

  <!-- wordmark + tagline -->
  <text x="790" y="140" font-family="sans-serif" font-size="52" font-weight="800" fill="url(#shine)">EasySupport</text>
  <text x="790" y="180" font-family="sans-serif" font-size="22" fill="#dbdee1" opacity="0.85">Discord tickets · taco empire · one config file</text>

  <!-- floating feature pills -->
  <g font-family="sans-serif" font-size="18" font-weight="600">
    <g>
      <rect x="790" y="205" width="150" height="38" rx="19" fill="#5865f2" fill-opacity="0.25" stroke="#5865f2" stroke-opacity="0.5"/>
      <text x="815" y="230" fill="#c7d2fe">🎫 Tickets</text>
    </g>
    <g>
      <rect x="955" y="205" width="170" height="38" rx="19" fill="#23a55a" fill-opacity="0.2" stroke="#23a55a" stroke-opacity="0.5"/>
      <text x="980" y="230" fill="#b7f7cd">🌮 Taco Empire</text>
    </g>
  </g>

  <!-- floating tacos -->
  <g>
    <g transform="translate(120 210)">
      <path d="M12 2C7 2 3 6 3 11v6h18v-6c0-5-4-9-9-9z" fill="#f6c453"/>
      <path d="M3 17h18v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#8b5e34"/>
      <circle cx="8" cy="9" r="1.6" fill="#57f287"/><circle cx="14" cy="8" r="1.6" fill="#ed4245"/><circle cx="11" cy="12" r="1.6" fill="#fee75c"/>
      <animateTransform attributeName="transform" type="translate" values="120 210;120 195;120 210" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(270 90) scale(0.7)">
      <path d="M12 2C7 2 3 6 3 11v6h18v-6c0-5-4-9-9-9z" fill="#f6c453"/>
      <path d="M3 17h18v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#8b5e34"/>
      <animateTransform attributeName="transform" type="translate" values="270 90;270 78;270 90" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1050 220) scale(0.8)">
      <path d="M12 2C7 2 3 6 3 11v6h18v-6c0-5-4-9-9-9z" fill="#f6c453"/>
      <path d="M3 17h18v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#8b5e34"/>
      <animateTransform attributeName="transform" type="translate" values="1050 220;1050 205;1050 220" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- corner wordmark -->
  <text x="1170" y="40" font-family="sans-serif" font-size="16" fill="#ffffff" opacity="0.5" text-anchor="end">A BITE OF POSSIBILITY</text>
</svg>
