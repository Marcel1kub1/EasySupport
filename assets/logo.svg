<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" aria-label="EasySupport">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mark: support ticket badge with E monogram -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="108" height="108" rx="20" fill="#171717" stroke="#333333" stroke-width="2"/>
    <rect x="0" y="0" width="108" height="6" rx="3" fill="url(#accent)"/>
    <circle cx="54" cy="44" r="14" fill="#171717" stroke="url(#accent)" stroke-width="3"/>
    <path d="M40 44 Q54 30 68 44" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 70 L54 92 L76 70" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="168" y="118" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">Easy</text>
  <text x="168" y="118" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="url(#accent)" letter-spacing="-0.02em" style="paint-order: stroke fill stroke;">
    <tspan x="304" dy="0">Support</tspan>
  </text>
</svg>
