name: Enforce and publish releases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  require-release-version:
    name: Require a new version release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version and release notes changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          non_workflow_changes="$(git diff --name-only "$BASE_SHA...HEAD" | grep -v '^\.github/workflows/' || true)"
          if [[ -z "$non_workflow_changes" ]]; then
            echo "Workflow-only change; no application release is required."
            exit 0
          fi

          base_version="$(git show "$BASE_SHA:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));")"
          current_version="$(node -p "require('./package.json').version")"

          if [[ "$base_version" == "$current_version" ]]; then
            echo "::error::Every pull request must bump package.json to a new release version."
            exit 1
          fi

          node - "$base_version" "$current_version" <<'NODE'
          const [base, current] = process.argv.slice(2);
          const parse = (version) => {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) throw new Error(`Invalid semantic version: ${version}`);
            return match.slice(1).map(Number);
          };
          const older = parse(base);
          const newer = parse(current);
          const isGreater = newer[0] > older[0] ||
            (newer[0] === older[0] && newer[1] > older[1]) ||
            (newer[0] === older[0] && newer[1] === older[1] && newer[2] > older[2]);
          if (!isGreater) {
            throw new Error(`Version ${current} must be greater than ${base}.`);
          }
          NODE

          node - "$current_version" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const feed = JSON.parse(fs.readFileSync('src/data/releases.json', 'utf8'));
          if (!feed.releases.some((release) => release.version === version)) {
            throw new Error(`src/data/releases.json must contain release ${version}.`);
          }
          if (!fs.readFileSync('src/data/releases.md', 'utf8').includes(version)) {
            throw new Error(`src/data/releases.md must document release ${version}.`);
          }
          NODE

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine whether this is a release commit
        id: release_guard
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous_version="$(git show HEAD^:package.json 2>/dev/null | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));" || true)"
          if [[ -n "$previous_version" && "$previous_version" == "$VERSION" ]]; then
            echo "Package version is unchanged; skipping release publication."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release notes
        if: steps.release_guard.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const feed = JSON.parse(fs.readFileSync('src/data/releases.json', 'utf8'));
          if (!feed.releases.some((release) => release.version === version)) {
            throw new Error(`src/data/releases.json must contain release ${version}.`);
          }
          NODE

      - name: Create or verify version tag
        if: steps.release_guard.outputs.should_release == 'true'
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git fetch --tags --force

          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            tagged_commit="$(git rev-parse "$tag^{commit}")"
            if [[ "$tagged_commit" == "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to this release commit."
            else
              echo "::warning::Tag $tag already points to $tagged_commit; keeping the existing immutable tag."
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "EasySupport $VERSION"
            git push origin "$tag"
            tagged_commit="$GITHUB_SHA"
          fi
          echo "target=$tagged_commit" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release_guard.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ steps.tag.outputs.target }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" \
              --target "$RELEASE_TARGET" \
              --title "EasySupport $VERSION" \
              --notes-file src/data/releases.md
          fi
