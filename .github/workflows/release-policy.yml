name: Release and issue triage

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Auto-release on push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20'

      - name: Determine next version from tags
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || echo "v2.3.1")
          CURRENT_VERSION=${LATEST_TAG#v}
          NEW_VERSION=$(node -e "
            const parts = '${CURRENT_VERSION}'.split('.').map(Number);
            parts[2] += 1;
            console.log(parts.join('.'));
          ")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}" --force

      - name: Get previous tag
        id: prev_tag
        shell: bash
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match="v*" "${{ steps.version.outputs.new_version }}^" 2>/dev/null || echo "")
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Generate AI changelog via Kilo
        id: changelog
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          COMMIT_FROM: ${{ steps.prev_tag.outputs.previous }}
          COMMIT_TO: "HEAD"
        shell: bash
        run: |
          node .github/scripts/generate-ai-changelog.js > changelog.md
          if [[ ! -s changelog.md ]]; then
            echo "::error::Kilo generated an empty changelog."
            exit 1
          fi
          echo "changelog_path=changelog.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.new_version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; deleting and recreating with new changelog."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          git push origin "$TAG" --force
          gh release create "$TAG" \
            --verify-tag \
            --title "EasySupport ${VERSION}" \
            --notes-file changelog.md

  triage:
    name: Triage GitHub issues
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20'

      - name: Extract issue context
        id: context
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_BODY="${{ github.event.issue.body }}"
            COMMENT_AUTHOR="${{ github.sender.login }}"
            ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
          else
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_TITLE="${{ github.event.issue.title }}"
            ISSUE_BODY="${{ github.event.issue.body }}"
            COMMENT_AUTHOR="${{ github.sender.login }}"
            ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_title=$ISSUE_TITLE" >> "$GITHUB_OUTPUT"
          echo "issue_body=$ISSUE_BODY" >> "$GITHUB_OUTPUT"
          echo "issue_author=$ISSUE_AUTHOR" >> "$GITHUB_OUTPUT"
          echo "comment_author=$COMMENT_AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Triage new issue (questions)
        if: github.event_name == 'issues'
        id: questions
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ISSUE_TITLE: ${{ steps.context.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.context.outputs.issue_body }}
        shell: bash
        run: |
          node .github/scripts/triage-issue.js --mode questions > triage-response.md
          gh issue comment ${{ steps.context.outputs.issue_number }} --body-file triage-response.md
          gh issue edit ${{ steps.context.outputs.issue_number }} --add-label "triage/needs-info"

      - name: Evaluate issue comment (summary)
        if: github.event_name == 'issue_comment' && steps.context.outputs.comment_author != steps.context.outputs.issue_author
        id: evaluate
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ISSUE_TITLE: ${{ steps.context.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.context.outputs.issue_body }}
        shell: bash
        run: |
          node .github/scripts/triage-issue.js --mode evaluate > triage-evaluation.md
          if grep -q "SUFFICIENT: yes" triage-evaluation.md; then
            echo "sufficient=true" >> "$GITHUB_OUTPUT"
          else
            echo "sufficient=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post dev summary
        if: steps.evaluate.outputs.sufficient == 'true'
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ISSUE_TITLE: ${{ steps.context.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.context.outputs.issue_body }}
        shell: bash
        run: |
          node .github/scripts/triage-issue.js --mode summary > dev-summary.md
          gh issue comment ${{ steps.context.outputs.issue_number }} --body-file dev-summary.md
          gh issue edit ${{ steps.context.outputs.issue_number }} --add-label "triage/ready" --remove-label "triage/needs-info"
