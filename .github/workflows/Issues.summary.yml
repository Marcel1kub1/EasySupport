name: Auto Assign CTO New Agent
on:
  issues:
    types: [opened]

jobs:
  assign-agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'Assign Agent'
        uses: pozil/auto-assign-issue@v4
        with:
          assignees: cto-new-bot
          numOfAssignee: 1
