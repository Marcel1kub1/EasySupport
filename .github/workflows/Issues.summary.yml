name: Auto Assign CTO New Agent
on:
  issues:
    types: [opened]

jobs:
  assign-agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign Agent via GitHub CLI
        run: |
          gh issue edit ${{ github.event.issue.number }} --add-assignee "cto-new[bot]"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
