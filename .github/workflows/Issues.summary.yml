name: Auto Assign CTO New Agent

on:
  issues:
    types: [opened, reopened]

jobs:
  assign-agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign Copilot agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee "copilot-swe-agent"
