name: Weekly Issues Summary
on:
  schedule:
    - cron: '0 9 * * 1' # Runs every Monday at 9:00 AM UTC
  workflow_dispatch: # Allows you to run it manually anytime with a button click

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Generate Issue Digest
        uses: nus-oss/GithubDigest@master
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
