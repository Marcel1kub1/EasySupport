name: Auto Issue Reply Agent
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Context
        uses: actions/checkout@v4

      - name: Generate AI Answer & Comment
        uses: mtfoley/pr-reviewer-action@v1.3.0
        with:
          # Automatically uses GitHub's internal runner token to write back to the issue
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tells the AI runner to handle the opened issue text layout
          prompt: "Analyze this issue description against the repository code. Provide a concise, clear breakdown or immediate step-by-step solution to help fix this issue."
