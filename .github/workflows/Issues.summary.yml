name: 🤖 Zero-Key Issue Summarizer

on:
  issues:
    types: [opened]

jobs:
  summarize-locally:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Install and Start Ollama (Local AI Engine)
        run: |
          curl -fsSL https://ollama.com | sh
          ollama serve &
          sleep 5

      - name: Download Light Developer LLM
        run: |
          ollama pull llama3.2:1b

      - name: Generate Developer Summary
        id: ai_engine
        run: |
          # 1. Create a safe text file containing the AI Instructions
          cat << 'EOF' > system_prompt.txt
          You are a strict developer assistant. Analyze the user's issue and completely rewrite it into a short technical breakdown for an engineering team. 
          Use exactly this markdown structure:

          ### 🛠️ Developer Summary
          **TL;DR:** (1 sentence summary explaining the core bug/request)
          **Steps to Reproduce:** (Numbered steps parsed from the user's explanation)
          **Technical Clues:** (Any errors, specific pages, or context clues mentioned)

          Keep your response short, direct, and formatted in markdown. Do not include conversational filler like "Here is the summary".
          EOF

          # 2. Save the messy user issue into a separate file
          cat << 'EOF' > user_issue.txt
          ${{ github.event.issue.body }}
          EOF

          # 3. Combine them safely into a final prompt file
          echo -e "\n\n--- HERE IS THE USER ISSUE TO SUMMARIZE ---\n" >> system_prompt.txt
          cat user_issue.txt >> system_prompt.txt

          # 4. Feed the file directly into Ollama so bash characters don't break it
          SUMMARY_OUTPUT=$(ollama run llama3.2:1b < system_prompt.txt)
          
          # 5. Export to GitHub Environment safely
          echo "AI_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY_OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Dev Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const summary = process.env.AI_SUMMARY;
            
            // Safety check: Make sure we didn't get empty data
            if (!summary || summary.trim().length === 0) {
              core.setFailed("AI failed to generate a proper summary.");
              return;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
