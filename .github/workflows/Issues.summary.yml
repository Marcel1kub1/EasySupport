name: 🤖 Issue Summarizer

on:
  issues:
    types: [opened]

jobs:
  summarize-locally:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Install and Start Ollama (Local AI Engine)
        run: |
          curl -fsSL https://ollama.com | sh
          # Start Ollama server in the background
          ollama serve &
          # Wait a few seconds for the background server to wake up
          sleep 5

      - name: Download Light Developer LLM
        run: |
          # Pulls the compact 1-billion parameter Llama 3.2 model
          ollama pull llama3.2:1b

      - name: Generate Developer Summary
        id: ai_engine
        run: |
          # Clean up the issue body text to make it safe for a shell script
          CLEAN_BODY=$(echo "${{ github.event.issue.body }}" | tr -d '"' | tr -d '`')
          
          # Construct the developer-centric prompt
          read -r -d '' SYSTEM_PROMPT << EOM
          You are a strict developer assistant. Analyze the user's issue and rewrite it into a short technical breakdown for an engineering team. 
          Use exactly this structure:
          ### 🛠️ Developer Summary
          **TL;DR:** (1 sentence summary)
          **Steps to Reproduce:** (Numbered steps)
          **Technical Clues:** (Any errors, elements, or context clues)
          Keep your response short, direct, and formatted in markdown. Do not include conversational filler like 'Here is the summary'.
          EOM

          # Run the issue text through the local model
          SUMMARY_OUTPUT=$(ollama run llama3.2:1b "$SYSTEM_PROMPT. Here is the issue: $CLEAN_BODY")
          
          # Save the result to a multi-line environment variable safely
          echo "AI_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY_OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Dev Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const summary = process.env.AI_SUMMARY;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
